# ============================================
# Latensys - Application Configuration
# With Alerting System
# ============================================

server:
  port: 8080
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: latensys

  # PostgreSQL Database Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # HikariCP Connection Pool Settings
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

# ============================================
# ✅ NEW: Alert Configuration
# ============================================
alerts:
  # Enable/disable all alerts
  enabled: ${ALERTS_ENABLED:true}
  evaluation-delay-ms: ${ALERT_EVALUATION_DELAY_MS:60000}
  min-requests: ${ALERT_MIN_REQUESTS:20}
  connect-timeout-ms: ${ALERT_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${ALERT_READ_TIMEOUT_MS:2000}

  # Slack webhook (optional)
  # Get from: https://api.slack.com/messaging/webhooks
  slack:
    webhook: ${SLACK_WEBHOOK_URL:}
    # Example: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
  discord:
    webhook: ${DISCORD_WEBHOOK_URL:}

# ============================================
# ✅ Rate Limit Configuration
# Both RateLimitingFilter and RateLimitController read from here.
# Changing these values updates enforcement AND the dashboard display.
# ============================================
rate-limit:
  default-max-requests: ${RATE_LIMIT_DEFAULT_MAX_REQUESTS:50}
  default-window-seconds: ${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:60}
  overrides:
    "[/test/hello]":
      max-requests: ${RATE_LIMIT_HELLO_MAX_REQUESTS:10}
      window-seconds: ${RATE_LIMIT_HELLO_WINDOW_SECONDS:60}
    "[/redis/test]":
      max-requests: ${RATE_LIMIT_REDIS_MAX_REQUESTS:3}
      window-seconds: ${RATE_LIMIT_REDIS_WINDOW_SECONDS:60}
    "[/app/hello]":
      max-requests: ${RATE_LIMIT_APP_HELLO_MAX_REQUESTS:5}
      window-seconds: ${RATE_LIMIT_APP_HELLO_WINDOW_SECONDS:60}

security:
  admin:
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}

app:
  upstream-url: ${APP_UPSTREAM_URL:http://127.0.0.1:8081}
  connect-timeout: ${APP_CONNECT_TIMEOUT:2s}
  request-timeout: ${APP_REQUEST_TIMEOUT:5s}
  max-request-bytes: ${APP_MAX_REQUEST_BYTES:65536}
  max-response-bytes: ${APP_MAX_RESPONSE_BYTES:1048576}
  allowed-paths: ${APP_ALLOWED_PATHS:/hello,/fail,/echo,/stats,/slow}

retention:
  enabled: ${RETENTION_ENABLED:true}
  days: ${RETENTION_DAYS:30}
  batch-size: ${RETENTION_BATCH_SIZE:5000}
  max-batches: ${RETENTION_MAX_BATCHES:10}
  cleanup-delay-ms: ${RETENTION_CLEANUP_DELAY_MS:3600000}
