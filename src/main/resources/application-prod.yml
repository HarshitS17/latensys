server:
  shutdown: graceful
  tomcat:
    use-relative-redirects: true
  servlet:
    session:
      cookie:
        secure: true

app:
  upstream-url: ${APP_UPSTREAM_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

security:
  trusted-proxy-ip: ${TRUSTED_PROXY_IP}
