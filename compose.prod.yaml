name: latensys-prod
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ${CADDYFILE_PATH:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      latensys:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.40.10
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100

  latensys:
    image: latensys:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-latensys}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      APP_UPSTREAM_URL: http://demo:8081
      TRUSTED_PROXY_IP: 172.30.40.10
      RATE_LIMIT_APP_HELLO_MAX_REQUESTS: ${RATE_LIMIT_APP_HELLO_MAX_REQUESTS:-5}
      RATE_LIMIT_APP_HELLO_WINDOW_SECONDS: ${RATE_LIMIT_APP_HELLO_WINDOW_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      demo:
        condition: service_healthy
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200

  demo:
    image: latensys-demo:1.0.0
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-latensys}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 100

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 100

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.40.0/24
  data:
    internal: true
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
